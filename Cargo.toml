[workspace]
resolver = "2"
members = [
    "crates/nobz-core",
    "crates/nobz-index",
    "crates/nobz-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/IGI-111/nobz"
homepage = "https://github.com/IGI-111/nobz"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
crc32fast = "1"
md-5 = "0.10"
unrar = { package = "newtua-unrar", version = "0.5.8-newtua.1" }
sevenz-rust2 = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
directories = "5"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
